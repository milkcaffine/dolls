<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>芝 · Dolls</title>
  <meta name="description" content="芝's Super Dollfie collection.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0b;
      --ink: #eceae6;
      --dim: #a39e96;
      --faint: #746f68;
      --line: #2a2826;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { background: var(--bg); color: var(--ink); }
    body {
      font-family: "IBM Plex Sans", "Noto Sans KR", system-ui, sans-serif;
      padding: 56px 20px 40px;
    }
    main { width: min(100%, 72rem); margin: 0 auto; }
    header { margin-bottom: 48px; }
    h1 { font-weight: 500; font-size: 1.6rem; letter-spacing: -0.02em; }
    .lede { margin-top: 6px; color: var(--dim); }
    .links { margin-top: 14px; font-size: 0.95rem; }
    a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
    a:hover { border-bottom-color: var(--ink); }
    section { margin-top: 28px; }
    h2 {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--faint);
      margin: 28px 0 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 18px 14px;
    }
    button.card {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    button.card img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      background: #161513;
    }
    button.card span {
      display: inline;
      margin-top: 7px;
      font-size: 0.78rem;
      color: var(--dim);
      line-height: 1.35;
    }
    button.card small.days {
      display: inline;
      margin-left: 0.4em;
      font-size: 0.72rem;
      color: var(--faint);
    }
    button.card:hover img { outline: 1px solid #3d3935; outline-offset: 3px; }
    footer { margin-top: 56px; color: var(--faint); font-size: 0.85rem; }
    dialog {
      border: 0;
      padding: 0;
      background: transparent;
      max-width: min(92vw, 880px);
    }
    dialog::backdrop { background: rgba(0, 0, 0, .82); }
    dialog img { width: 100%; height: auto; display: block; }
    dialog p { color: #d8d4ce; font-size: 0.85rem; margin-top: 8px; text-align: center; }
  </style>
</head>

  <dialog id="view">
    <img alt="">
    <p></p>
  </dialog>
  <script>
    document.querySelectorAll("[data-since]").forEach((card) => {
      const parts = card.dataset.since.split("-").map(Number);
      const since = new Date(parts[0], parts[1] - 1, parts[2]);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const days = Math.floor((today - since) / 86400000);
      const el = card.querySelector(".days");
      if (el && !Number.isNaN(days)) el.textContent = days.toLocaleString("ko-KR") + "일";
    });
    const view = document.getElementById("view");
    const shot = view.querySelector("img");
    const cap = view.querySelector("p");
    document.querySelectorAll("button.card").forEach((card) => {
      card.addEventListener("click", () => {
        shot.src = card.dataset.src;
        cap.textContent = card.querySelector("span").textContent;
        view.showModal();
      });
    });
    view.addEventListener("click", () => view.close());
  </script>
