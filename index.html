<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>芝 · Dolls</title>
  <meta name="description" content="芝's Super Dollfie collection.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0b;
      --ink: #eceae6;
      --dim: #a39e96;
      --faint: #746f68;
      --line: #2a2826;
      --card-bg: #161513;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { background: var(--bg); color: var(--ink); }
    body {
      font-family: "IBM Plex Sans", "Noto Sans KR", system-ui, sans-serif;
      padding: 56px 20px 40px;
    }
    main { width: min(100%, 72rem); margin: 0 auto; }
    header { margin-bottom: 28px; }
    h1 { font-weight: 500; font-size: 1.6rem; letter-spacing: -0.02em; }
    .lede { margin-top: 6px; color: var(--dim); }
    .links { margin-top: 14px; font-size: 0.95rem; }
    a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
    a:hover { border-bottom-color: var(--ink); }

    /* Controls (Search, Chips, View, Sort) */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 32px 0 36px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }
    .search-row {
      display: flex;
      align-items: center;
      position: relative;
      max-width: 440px;
    }
    .search-input {
      width: 100%;
      background: #141312;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 32px 8px 12px;
      color: var(--ink);
      font: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus {
      border-color: #55514b;
    }
    .search-input::placeholder {
      color: var(--faint);
    }
    .search-clear {
      position: absolute;
      right: 8px;
      background: none;
      border: 0;
      color: var(--faint);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      padding: 2px 6px;
      line-height: 1;
    }
    .search-clear:hover {
      color: var(--ink);
    }

    /* Quick Chips */
    .quick-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .chips-label {
      font-size: 0.7rem;
      color: var(--faint);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-right: 2px;
    }
    .chip {
      background: #141312;
      border: 1px solid var(--line);
      color: var(--dim);
      font: inherit;
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover {
      border-color: #4a4540;
      color: var(--ink);
      background: #1a1917;
    }
    .chip.active {
      background: #2b2824;
      border-color: #635d55;
      color: var(--ink);
      font-weight: 500;
    }

    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ctrl-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .ctrl-label {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--faint);
      min-width: 38px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .ctrl-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--dim);
      font: inherit;
      font-size: 0.82rem;
      padding: 4px 9px;
      border-radius: 3px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .ctrl-btn:hover {
      color: var(--ink);
      background: #181715;
    }
    .ctrl-btn.active {
      color: var(--ink);
      background: #23211e;
      border-color: #383430;
      font-weight: 500;
    }
    .ctrl-count {
      color: var(--faint);
      font-size: 0.74rem;
      margin-left: 3px;
    }
    .active .ctrl-count {
      color: var(--dim);
    }
    .status-text {
      font-size: 0.78rem;
      color: var(--faint);
      margin-top: 2px;
    }

    /* Content & Grid */
    section { margin-top: 28px; }
    h2 {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--faint);
      margin: 28px 0 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 18px 14px;
    }
    button.card {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: var(--card-bg);
      overflow: hidden;
    }
    button.card img {
      width: 100%;
      height: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      background: var(--card-bg);
    }
    .badge-anniv {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(18, 16, 14, 0.88);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(220, 180, 120, 0.45);
      color: #f5d49e;
      font-size: 0.68rem;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 3px;
      pointer-events: none;
      line-height: 1.25;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .badge-anniv.today {
      border-color: #ffd885;
      color: #fff2c4;
      background: rgba(36, 30, 20, 0.94);
    }
    button.card span {
      display: inline;
      margin-top: 7px;
      font-size: 0.78rem;
      color: var(--dim);
      line-height: 1.35;
    }
    button.card small.days {
      display: inline;
      margin-left: 0.4em;
      font-size: 0.72rem;
      color: var(--faint);
    }
    button.card:hover .card-thumb-wrap img { outline: 1px solid #3d3935; outline-offset: 3px; }

    .empty-msg {
      padding: 48px 0;
      text-align: center;
      color: var(--dim);
      font-size: 0.9rem;
    }

    footer { margin-top: 56px; color: var(--faint); font-size: 0.85rem; }

    /* Scroll to Top Button */
    .scroll-top-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #181716;
      border: 1px solid var(--line);
      color: var(--dim);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s, background 0.15s, color 0.15s, border-color 0.15s;
      z-index: 20;
    }
    .scroll-top-btn.visible {
      opacity: 1;
      visibility: visible;
    }
    .scroll-top-btn:hover {
      background: #252320;
      border-color: #444;
      color: var(--ink);
    }

    /* Modal (Lightbox with Prev / Next) */
    dialog#view {
      border: 0;
      padding: 0;
      background: transparent;
      max-width: 96vw;
      max-height: 96vh;
      width: fit-content;
      margin: auto;
      color: var(--ink);
      outline: none;
    }
    dialog#view::backdrop {
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(2px);
    }
    .dialog-content {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      outline: none;
    }
    .dialog-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: min(92vw, 880px);
    }
    dialog img {
      display: block;
      max-width: min(90vw, 840px);
      max-height: calc(85vh - 3.5rem);
      width: auto;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
      border-radius: 2px;
      user-select: none;
      -webkit-user-select: none;
    }
    .dialog-info {
      margin-top: 10px;
      text-align: center;
    }
    .dialog-name {
      font-size: 0.95rem;
      font-weight: 500;
      color: #edebe7;
    }
    .dialog-meta {
      font-size: 0.78rem;
      color: var(--dim);
      margin-top: 3px;
    }
    .modal-btn {
      background: rgba(22, 21, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--ink);
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .modal-btn:hover {
      background: rgba(45, 42, 38, 0.95);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .modal-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      font-size: 1.8rem;
      line-height: 1;
      z-index: 10;
    }
    .modal-nav.prev { left: 16px; }
    .modal-nav.next { right: 16px; }
    .modal-close {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      font-size: 1.3rem;
      z-index: 10;
    }
    @media (max-width: 600px) {
      .modal-nav {
        width: 36px;
        height: 36px;
        font-size: 1.4rem;
      }
      .modal-nav.prev { left: 8px; }
      .modal-nav.next { right: 8px; }
      .modal-close { top: 12px; right: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>芝</h1>
      <p class="lede">Super Dollfie collection.</p>
      <p class="links"><a href="https://x.com/euclidmilk">X @euclidmilk</a> · tools: <a href="x-split.html">x-split</a> · <a href="collage.html">collage</a> · <a href="oekaki.html">oekaki</a></p>
    </header>

    <div class="controls">
      <div class="search-row">
        <input type="text" id="searchInput" class="search-input" placeholder="인형 이름 검색..." autocomplete="off" spellcheck="false">
        <button type="button" id="searchClear" class="search-clear" aria-label="검색어 지우기">&times;</button>
      </div>

      <!-- Quick Chips -->
      <div class="quick-chips" id="quickChips">
        <span class="chips-label">TAGS:</span>
        <button type="button" class="chip" data-tag="SD17">SD17</button>
        <button type="button" class="chip" data-tag="SDGr">SDGr</button>
        <button type="button" class="chip" data-tag="DSD">DSD</button>
        <button type="button" class="chip" data-tag="Williams">Williams</button>
        <button type="button" class="chip" data-tag="Legulus">Legulus</button>
        <button type="button" class="chip" data-tag="Michael">Michael</button>
        <button type="button" class="chip" data-tag="Reda">Reda</button>
      </div>

      <div class="filter-section">
        <div class="ctrl-row">
          <span class="ctrl-label">보기</span>
          <div class="btn-group" id="viewTabs"></div>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-label">정렬</span>
          <div class="btn-group" id="sortTabs">
            <button type="button" class="ctrl-btn active" data-sort="random">무작위 🔀</button>
            <button type="button" class="ctrl-btn" data-sort="newest">최신순</button>
            <button type="button" class="ctrl-btn" data-sort="oldest">오래된순</button>
            <button type="button" class="ctrl-btn" data-sort="name">이름순</button>
            <button type="button" class="ctrl-btn" data-sort="default">기본순</button>
          </div>
        </div>
      </div>
      <div class="status-text" id="statusText"></div>
    </div>

    <div id="sections"></div>
    <footer>芝</footer>
  </main>

  <!-- Scroll Top Button -->
  <button type="button" id="scrollTopBtn" class="scroll-top-btn" aria-label="맨 위로 가기">↑</button>

  <!-- Modal / Lightbox -->
  <dialog id="view">
    <div class="dialog-content">
      <button type="button" class="modal-btn modal-close" id="modalClose" aria-label="닫기">&times;</button>
      <button type="button" class="modal-btn modal-nav prev" id="modalPrev" aria-label="이전 인형">‹</button>
      <div class="dialog-stage">
        <img alt="">
        <div class="dialog-info">
          <p class="dialog-name"></p>
          <p class="dialog-meta"></p>
        </div>
      </div>
      <button type="button" class="modal-btn modal-nav next" id="modalNext" aria-label="다음 인형">›</button>
    </div>
  </dialog>

  <script src="data.js"></script>
  <script>
    const IMG = "images/";
    const THUMB = "images/thumbs/";

    // 1. 데이터 평탄화 및 인덱스 부여
    let globalIndex = 0;
    const allDolls = [];
    const sectionsMeta = (window.DOLL_SECTIONS || []).map((sec) => {
      const items = (sec.items || []).map((item) => {
        const enriched = {
          ...item,
          _origIndex: globalIndex++,
          _sectionId: sec.id,
          _sectionTitle: sec.title
        };
        allDolls.push(enriched);
        return enriched;
      });
      return { id: sec.id, title: sec.title, count: items.length };
    });

    // 상태 관리
    let currentView = "all";   // "all" 또는 특정 section.id
    let currentSort = "random"; // "random" | "newest" | "oldest" | "name" | "default"
    let searchQuery = "";
    let randomOrderMap = new Map();
    let currentDisplayedList = []; // 현재 화면에 보이는 인형 목록 (모달 이전/다음 네비게이션용)
    let currentModalIndex = -1;

    // Fisher-Yates 무작위 순서 키 생성
    function refreshRandomOrder() {
      const indices = allDolls.map((_, i) => i);
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      randomOrderMap = new Map(indices.map((origIdx, order) => [allDolls[origIdx], order]));
    }
    refreshRandomOrder();

    function daysSince(iso) {
      if (!iso) return "";
      const parts = iso.split("-").map(Number);
      if (parts.length < 3) return "";
      const since = new Date(parts[0], parts[1] - 1, parts[2]);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const days = Math.floor((today - since) / 86400000);
      return Number.isNaN(days) ? "" : days.toLocaleString("ko-KR") + "일";
    }

    // 기념일(도착 N주년) 계산
    function getAnniversary(iso) {
      if (!iso) return null;
      const parts = iso.split("-").map(Number);
      if (parts.length < 3) return null;
      const [sYear, sMonth, sDay] = parts;
      const now = new Date();
      const tYear = now.getFullYear();
      const tMonth = now.getMonth() + 1;
      const tDay = now.getDate();

      const years = tYear - sYear;
      if (years < 1) return null;

      if (sMonth === tMonth && sDay === tDay) {
        return { isToday: true, label: `🎂 오늘 ${years}주년!` };
      }
      if (sMonth === tMonth) {
        return { isToday: false, label: `🎂 ${years}주년 (${sMonth}.${String(sDay).padStart(2, "0")})` };
      }
      return null;
    }

    function card(item, displayIndex) {
      const btn = document.createElement("button");
      btn.className = "card";
      btn.dataset.displayIndex = displayIndex;

      const thumbWrap = document.createElement("div");
      thumbWrap.className = "card-thumb-wrap";

      const img = document.createElement("img");
      img.src = THUMB + item.src;
      img.alt = item.name;
      img.loading = "lazy";
      img.decoding = "async";
      thumbWrap.appendChild(img);

      const anniv = getAnniversary(item.since);
      if (anniv) {
        const badge = document.createElement("span");
        badge.className = "badge-anniv" + (anniv.isToday ? " today" : "");
        badge.textContent = anniv.label;
        thumbWrap.appendChild(badge);
      }

      const name = document.createElement("span");
      name.textContent = item.name;

      const days = document.createElement("small");
      days.className = "days";
      if (item.since) days.textContent = daysSince(item.since);

      btn.append(thumbWrap, name, days);
      return btn;
    }

    function sortItems(items) {
      const list = [...items];
      if (currentSort === "random") {
        return list.sort((a, b) => (randomOrderMap.get(a) ?? 0) - (randomOrderMap.get(b) ?? 0));
      }
      if (currentSort === "newest") {
        return list.sort((a, b) => (b.since || "").localeCompare(a.since || ""));
      }
      if (currentSort === "oldest") {
        return list.sort((a, b) => (a.since || "9999").localeCompare(b.since || "9999"));
      }
      if (currentSort === "name") {
        return list.sort((a, b) => a.name.localeCompare(b.name, "ko", { sensitivity: "base" }));
      }
      return list.sort((a, b) => a._origIndex - b._origIndex);
    }

    function renderViewTabs() {
      const viewTabs = document.getElementById("viewTabs");
      viewTabs.innerHTML = "";

      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = "ctrl-btn" + (currentView === "all" ? " active" : "");
      allBtn.dataset.view = "all";
      allBtn.innerHTML = `전체 <span class="ctrl-count">${allDolls.length}</span>`;
      viewTabs.appendChild(allBtn);

      sectionsMeta.forEach((sec) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ctrl-btn" + (currentView === sec.id ? " active" : "");
        btn.dataset.view = sec.id;
        btn.innerHTML = `${sec.title} <span class="ctrl-count">${sec.count}</span>`;
        viewTabs.appendChild(btn);
      });
    }

    function updateQuickChipsActiveState() {
      const q = searchQuery.trim().toLowerCase();
      document.querySelectorAll("#quickChips .chip").forEach((chip) => {
        const tag = chip.dataset.tag.toLowerCase();
        chip.classList.toggle("active", q === tag);
      });
    }

    function render() {
      const root = document.getElementById("sections");
      root.innerHTML = "";

      const q = searchQuery.trim().toLowerCase();
      updateQuickChipsActiveState();

      let filtered = allDolls.filter((item) => {
        if (currentView !== "all" && item._sectionId !== currentView) return false;
        if (q && !item.name.toLowerCase().includes(q)) return false;
        return true;
      });

      const statusText = document.getElementById("statusText");
      if (q) {
        statusText.textContent = `검색 결과: ${filtered.length}개 (전체 ${allDolls.length}개 중)`;
      } else if (currentView !== "all") {
        const currentSec = sectionsMeta.find((s) => s.id === currentView);
        statusText.textContent = `${currentSec ? currentSec.title : ""} · ${filtered.length}개`;
      } else {
        statusText.textContent = `총 ${filtered.length}개`;
      }

      if (filtered.length === 0) {
        currentDisplayedList = [];
        const empty = document.createElement("div");
        empty.className = "empty-msg";
        empty.textContent = q ? `"${searchQuery}"에 해당하는 인형을 찾을 수 없습니다.` : "등록된 인형이 없습니다.";
        root.appendChild(empty);
        return;
      }

      if (currentView === "all" && currentSort === "default" && !q) {
        currentDisplayedList = [];
        for (const sec of window.DOLL_SECTIONS) {
          const items = sec.items || [];
          if (!items.length) continue;
          const el = document.createElement("section");
          const h2 = document.createElement("h2");
          h2.textContent = sec.title;
          const grid = document.createElement("div");
          grid.className = "grid";
          grid.id = sec.id;
          for (const item of items) {
            const displayIdx = currentDisplayedList.length;
            currentDisplayedList.push(item);
            grid.appendChild(card(item, displayIdx));
          }
          el.append(h2, grid);
          root.appendChild(el);
        }
      } else {
        const sorted = sortItems(filtered);
        currentDisplayedList = sorted;
        const el = document.createElement("section");
        const grid = document.createElement("div");
        grid.className = "grid";
        sorted.forEach((item, idx) => grid.appendChild(card(item, idx)));
        el.appendChild(grid);
        root.appendChild(el);
      }
    }

    renderViewTabs();
    render();

    // 1. 보기 탭 클릭
    document.getElementById("viewTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".ctrl-btn");
      if (!btn) return;
      currentView = btn.dataset.view;
      document.querySelectorAll("#viewTabs .ctrl-btn").forEach((b) => b.classList.toggle("active", b === btn));
      render();
    });

    // 2. 정렬 탭 클릭
    document.getElementById("sortTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".ctrl-btn");
      if (!btn) return;
      const sortType = btn.dataset.sort;
      if (sortType === "random") refreshRandomOrder();
      currentSort = sortType;
      document.querySelectorAll("#sortTabs .ctrl-btn").forEach((b) => b.classList.toggle("active", b === btn));
      render();
    });

    // 3. 검색 입력 & 클리어
    const searchInput = document.getElementById("searchInput");
    const searchClear = document.getElementById("searchClear");

    function executeSearch(query) {
      searchInput.value = query;
      searchQuery = query;
      searchClear.style.display = query ? "block" : "none";
      render();
    }

    searchInput.addEventListener("input", (e) => executeSearch(e.target.value));

    searchClear.addEventListener("click", () => {
      executeSearch("");
      searchInput.focus();
    });

    // 4. 퀵 태그 칩 클릭
    document.getElementById("quickChips").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      const tag = chip.dataset.tag;
      if (searchQuery.trim().toLowerCase() === tag.toLowerCase()) {
        executeSearch("");
      } else {
        executeSearch(tag);
      }
    });

    // 5. 맨 위로 가기 (Top) 버튼
    const scrollTopBtn = document.getElementById("scrollTopBtn");
    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        scrollTopBtn.classList.add("visible");
      } else {
        scrollTopBtn.classList.remove("visible");
      }
    }, { passive: true });

    scrollTopBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // 6. 모달(Lightbox) & 이전/다음 탐색 기능
    const viewModal = document.getElementById("view");
    const shot = viewModal.querySelector("img");
    const modalName = viewModal.querySelector(".dialog-name");
    const modalMeta = viewModal.querySelector(".dialog-meta");
    const modalPrev = document.getElementById("modalPrev");
    const modalNext = document.getElementById("modalNext");
    const modalClose = document.getElementById("modalClose");

    function showModalItem(index) {
      if (!currentDisplayedList.length) return;
      currentModalIndex = (index + currentDisplayedList.length) % currentDisplayedList.length;
      const item = currentDisplayedList[currentModalIndex];
      shot.src = IMG + item.src;
      shot.alt = item.name;
      modalName.textContent = item.name;

      const metaParts = [];
      if (item._sectionTitle) metaParts.push(item._sectionTitle);
      if (item.since) {
        const days = daysSince(item.since);
        metaParts.push(`${item.since}${days ? ` · ${days}` : ""}`);
        const anniv = getAnniversary(item.since);
        if (anniv) metaParts.push(anniv.label);
      }
      metaParts.push(`${currentModalIndex + 1} / ${currentDisplayedList.length}`);
      modalMeta.textContent = metaParts.join(" · ");

      if (!viewModal.open) viewModal.showModal();
    }

    document.getElementById("sections").addEventListener("click", (e) => {
      const btn = e.target.closest("button.card");
      if (!btn) return;
      const idx = Number(btn.dataset.displayIndex);
      if (!Number.isNaN(idx)) showModalItem(idx);
    });

    modalPrev.addEventListener("click", (e) => {
      e.stopPropagation();
      showModalItem(currentModalIndex - 1);
    });

    modalNext.addEventListener("click", (e) => {
      e.stopPropagation();
      showModalItem(currentModalIndex + 1);
    });

    modalClose.addEventListener("click", () => viewModal.close());

    // 배경 클릭 시 닫기
    viewModal.addEventListener("click", (e) => {
      if (e.target === viewModal || e.target.classList.contains("dialog-content")) {
        viewModal.close();
      }
    });

    // 키보드 네비게이션 (← / → / Esc)
    window.addEventListener("keydown", (e) => {
      if (!viewModal.open) return;
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        showModalItem(currentModalIndex - 1);
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        showModalItem(currentModalIndex + 1);
      }
    });

    // 모바일 터치 스와이프
    let touchStartX = 0;
    let touchStartY = 0;
    viewModal.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    viewModal.addEventListener("touchend", (e) => {
      const diffX = e.changedTouches[0].clientX - touchStartX;
      const diffY = e.changedTouches[0].clientY - touchStartY;
      // 가로 스와이프 판정 (세로 스크롤과 구분)
      if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 0) showModalItem(currentModalIndex - 1); // 오른쪽으로 쓸어넘기면 이전
        else showModalItem(currentModalIndex + 1);          // 왼쪽으로 쓸어넘기면 다음
      }
    }, { passive: true });
  </script>
</body>
</html>
